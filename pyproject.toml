[project]
name = "model-router"
version = "0.1.0"
description = "Cost-efficient model+effort routing for Claude API calls"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
